<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snow performance fixture</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#1c2430}#scene{position:relative;overflow:hidden;width:100vw;height:100dvh;isolation:isolate}img{display:block;width:100%;height:100%;object-fit:cover}</style>
<div id="scene"><img src="../../assets/main.png" alt="Макет"></div>
<script type="module">
import {Snow} from '../../src/snow.js';
const params=new URLSearchParams(location.search);
window.effect=new Snow(document.querySelector('#scene'),{count:Number(params.get('count')??40),size:Number(params.get('size')??2),sizeVariation:Number(params.get('sizeVariation')??.8),blur:Number(params.get('blur')??.4),speed:Number(params.get('speed')??28),wind:Number(params.get('wind')??6),sway:Number(params.get('sway')??10),enabled:params.get('enabled')!=='false'},{referenceWidth:393});
window.effect.setClip(98,818);
</script></html>
